syntax = "proto3";

package backend.command.v1;

import "backend/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

service CommandService {
  rpc CreateSimulation(CreateSimulationRequest) returns (CreateSimulationResponse);
  rpc UpdateSimulation(UpdateSimulationRequest) returns (UpdateSimulationResponse);
  rpc DeleteSimulation(DeleteSimulationRequest) returns (DeleteSimulationResponse);
  rpc CreateSeries(CreateSeriesRequest) returns (CreateSeriesResponse);
  rpc UpdateSeries(UpdateSeriesRequest) returns (UpdateSeriesResponse);
  rpc DeleteSeries(DeleteSeriesRequest) returns (DeleteSeriesResponse);
  rpc CreateSeason(CreateSeasonRequest) returns (CreateSeasonResponse);
  rpc UpdateSeason(UpdateSeasonRequest) returns (UpdateSeasonResponse);
  rpc DeleteSeason(DeleteSeasonRequest) returns (DeleteSeasonResponse);
  rpc CreateEvent(CreateEventRequest) returns (CreateEventResponse);
  rpc UpdateEvent(UpdateEventRequest) returns (UpdateEventResponse);
  rpc DeleteEvent(DeleteEventRequest) returns (DeleteEventResponse);
  rpc CreateRace(CreateRaceRequest) returns (CreateRaceResponse);
  rpc UpdateRace(UpdateRaceRequest) returns (UpdateRaceResponse);
  rpc DeleteRace(DeleteRaceRequest) returns (DeleteRaceResponse);
  rpc CreateResultEntry(CreateResultEntryRequest) returns (CreateResultEntryResponse);
  rpc UpdateResultEntry(UpdateResultEntryRequest) returns (UpdateResultEntryResponse);
  rpc DeleteResultEntry(DeleteResultEntryRequest) returns (DeleteResultEntryResponse);
  rpc CreateRaceGrid(CreateRaceGridRequest) returns (CreateRaceGridResponse);
  rpc UpdateRaceGrid(UpdateRaceGridRequest) returns (UpdateRaceGridResponse);
  rpc DeleteRaceGrid(DeleteRaceGridRequest) returns (DeleteRaceGridResponse);

  rpc CreateDriver(CreateDriverRequest) returns (CreateDriverResponse);
  rpc UpdateDriver(UpdateDriverRequest) returns (UpdateDriverResponse);
  rpc DeleteDriver(DeleteDriverRequest) returns (DeleteDriverResponse);
  rpc SetSimulationDriverAliases(SetSimulationDriverAliasesRequest) returns (SetSimulationDriverAliasesResponse);
  rpc SetSeasonDrivers(SetSeasonDriversRequest) returns (SetSeasonDriversResponse);
  rpc AddSeasonDriver(AddSeasonDriverRequest) returns (AddSeasonDriverResponse);
  rpc RemoveSeasonDriver(RemoveSeasonDriverRequest) returns (RemoveSeasonDriverResponse);
  rpc DeleteSeasonDriver(DeleteSeasonDriverRequest) returns (DeleteSeasonDriverResponse);
  rpc SetSeasonCarClasses(SetSeasonCarClassesRequest) returns (SetSeasonCarClassesResponse);

  rpc SetSeasonCarModelVariants(SetSeasonCarModelVariantsRequest) returns (SetSeasonCarModelVariantsResponse);

  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse);
  rpc UpdateTeam(UpdateTeamRequest) returns (UpdateTeamResponse);
  rpc DeleteTeam(DeleteTeamRequest) returns (DeleteTeamResponse);
  rpc SetTeamMembers(SetTeamMembersRequest) returns (SetTeamMembersResponse);
  rpc AddTeamMember(AddTeamMemberRequest) returns (AddTeamMemberResponse);
  rpc RemoveTeamMember(RemoveTeamMemberRequest) returns (RemoveTeamMemberResponse);
  rpc DeleteTeamMember(DeleteTeamMemberRequest) returns (DeleteTeamMemberResponse);

  rpc CreatePointSystem(CreatePointSystemRequest) returns (CreatePointSystemResponse);
  rpc UpdatePointSystem(UpdatePointSystemRequest) returns (UpdatePointSystemResponse);
  rpc DeletePointSystem(DeletePointSystemRequest) returns (DeletePointSystemResponse);

  rpc CreateTrack(CreateTrackRequest) returns (CreateTrackResponse);
  rpc UpdateTrack(UpdateTrackRequest) returns (UpdateTrackResponse);
  rpc DeleteTrack(DeleteTrackRequest) returns (DeleteTrackResponse);
  rpc CreateTrackLayout(CreateTrackLayoutRequest) returns (CreateTrackLayoutResponse);
  rpc UpdateTrackLayout(UpdateTrackLayoutRequest) returns (UpdateTrackLayoutResponse);
  rpc DeleteTrackLayout(DeleteTrackLayoutRequest) returns (DeleteTrackLayoutResponse);
  rpc SetSimulationTrackLayoutAliases(SetSimulationTrackLayoutAliasesRequest) returns (SetSimulationTrackLayoutAliasesResponse);

  rpc CreateCarManufacturer(CreateCarManufacturerRequest) returns (CreateCarManufacturerResponse);
  rpc UpdateCarManufacturer(UpdateCarManufacturerRequest) returns (UpdateCarManufacturerResponse);
  rpc DeleteCarManufacturer(DeleteCarManufacturerRequest) returns (DeleteCarManufacturerResponse);

  // Additive v1 APIs for manufacturer -> model -> model_variant hierarchy.
  rpc CreateCarModel(CreateCarModelRequest) returns (CreateCarModelResponse);
  rpc UpdateCarModel(UpdateCarModelRequest) returns (UpdateCarModelResponse);
  rpc DeleteCarModel(DeleteCarModelRequest) returns (DeleteCarModelResponse);

  rpc CreateCarModelVariant(CreateCarModelVariantRequest) returns (CreateCarModelVariantResponse);
  rpc UpdateCarModelVariant(UpdateCarModelVariantRequest) returns (UpdateCarModelVariantResponse);
  rpc DeleteCarModelVariant(DeleteCarModelVariantRequest) returns (DeleteCarModelVariantResponse);

  rpc CreateCarClass(CreateCarClassRequest) returns (CreateCarClassResponse);
  rpc UpdateCarClass(UpdateCarClassRequest) returns (UpdateCarClassResponse);
  rpc DeleteCarClass(DeleteCarClassRequest) returns (DeleteCarClassResponse);
  rpc AssignCarModelVariantToCarClass(AssignCarModelVariantToCarClassRequest) returns (AssignCarModelVariantToCarClassResponse);
  rpc AssignCarClassToSeason(AssignCarClassToSeasonRequest) returns (AssignCarClassToSeasonResponse);
  rpc UnassignCarModelVariantFromCarClass(UnassignCarModelVariantFromCarClassRequest) returns (UnassignCarModelVariantFromCarClassResponse);
  rpc UnassignCarClassFromSeason(UnassignCarClassFromSeasonRequest) returns (UnassignCarClassFromSeasonResponse);

  rpc SetSimulationCarAliases(SetSimulationCarAliasesRequest) returns (SetSimulationCarAliasesResponse);
}

message CreateSimulationRequest {
  string name = 1;
  bool is_active = 2;
  repeated backend.common.v1.ImportConfig supported_formats = 3;
}

message CreateSimulationResponse {
  backend.common.v1.Simulation simulation = 1;
}

message UpdateSimulationRequest {
  uint32 simulation_id = 1;
  string name = 2;
  bool is_active = 3;
  repeated backend.common.v1.ImportConfig supported_formats = 4;
}

message UpdateSimulationResponse {
  backend.common.v1.Simulation simulation = 1;
}

message DeleteSimulationRequest {
  uint32 simulation_id = 1;
}

message DeleteSimulationResponse {
  bool deleted = 1;
}

message CreateSeriesRequest {
  uint32 simulation_id = 1;
  string name = 2;
  string description = 3;
  bool is_active = 4;
}

message CreateSeriesResponse {
  backend.common.v1.Series series = 1;
}

message UpdateSeriesRequest {
  uint32 series_id = 1;
  uint32 simulation_id = 2;
  string name = 3;
  string description = 4;
  bool is_active = 5;
}

message UpdateSeriesResponse {
  backend.common.v1.Series series = 1;
}

message DeleteSeriesRequest {
  uint32 series_id = 1;
}

message DeleteSeriesResponse {
  bool deleted = 1;
}

message CreateSeasonRequest {
  uint32 series_id = 1;
  string name = 2;
  uint32 point_system_id = 3;
  int32 skip_events = 4;
  int32 num_grids = 5; // number of grids per event. Default is 1.
  bool has_teams = 6; // uses team standings (in addition to driver standings)
  bool is_team_based = 7; // use teams instead of drivers for points and standings
  int32 team_points_top_n = 8; // use top N team driver results for team standings
  bool is_multiclass = 9;
  string status = 10;
  google.protobuf.Timestamp starts_at = 11;
  google.protobuf.Timestamp ends_at = 12;
}

message CreateSeasonResponse {
  backend.common.v1.Season season = 1;
}

message UpdateSeasonRequest {
  uint32 season_id = 1;
  string name = 2;
  uint32 point_system_id = 3;
  int32 skip_events = 4;
  int32 num_grids = 5; // number of grids per event.
  bool has_teams = 6; // uses team standings (in addition to driver standings)
  bool is_team_based = 7; // use teams instead of drivers for points and standings
  int32 team_points_top_n = 8; // use top N team driver results for team standings
  bool is_multiclass = 9;
  string status = 10;
  google.protobuf.Timestamp starts_at = 11;
  google.protobuf.Timestamp ends_at = 12;
}

message UpdateSeasonResponse {
  backend.common.v1.Season season = 1;
}

message DeleteSeasonRequest {
  uint32 season_id = 1;
}

message DeleteSeasonResponse {
  bool deleted = 1;
}

message CreateEventRequest {
  uint32 season_id = 1;
  uint32 track_layout_id = 2;
  string name = 3;
  uint32 sequence_no = 4;
  google.protobuf.Timestamp event_date = 5;
  backend.common.v1.EventStatus status = 6;
  backend.common.v1.EventProcessingState processing_state = 7;
  uint32 point_system_id = 8; // if 0, the default point system for the season will be used.
}

message CreateEventResponse {
  backend.common.v1.Event event = 1;
}

message UpdateEventRequest {
  uint32 event_id = 1;
  uint32 season_id = 2;
  uint32 track_layout_id = 3;
  string name = 4;
  uint32 sequence_no = 5;
  google.protobuf.Timestamp event_date = 6;
  backend.common.v1.EventStatus status = 7;
  backend.common.v1.EventProcessingState processing_state = 8;
  uint32 point_system_id = 9; // if 0, the default point system for the season will be used.
}

message UpdateEventResponse {
  backend.common.v1.Event event = 1;
}

message DeleteEventRequest {
  uint32 event_id = 1;
}

message DeleteEventResponse {
  bool deleted = 1;
}

message CreateRaceRequest {
  uint32 event_id = 1;
  string name = 2;
  backend.common.v1.RaceSessionType session_type = 3;
  int32 sequence_no = 4;
}

message CreateRaceResponse {
  backend.common.v1.Race race = 1;
}
message UpdateRaceRequest {
  uint32 race_id = 1;
  uint32 event_id = 2;
  string name = 3;
  backend.common.v1.RaceSessionType session_type = 4;
  int32 sequence_no = 5;
}

message UpdateRaceResponse {
  backend.common.v1.Race race = 1;
}

message DeleteRaceRequest {
  uint32 race_id = 1;
}

message DeleteRaceResponse {
  bool deleted = 1;
}

message CreateRaceGridRequest {
  uint32 race_id = 1;
  string name = 2;
  backend.common.v1.RaceSessionType session_type = 3;
  int32 sequence_no = 4;
}

message CreateRaceGridResponse {
  backend.common.v1.RaceGrid race_grid = 1;
}
message UpdateRaceGridRequest {
  uint32 race_grid_id = 1;
  string name = 2;
  backend.common.v1.RaceSessionType session_type = 3;
  int32 sequence_no = 4;
}
message UpdateRaceGridResponse {
  backend.common.v1.RaceGrid race_grid = 1;
}

message DeleteRaceGridRequest {
  uint32 race_grid_id = 1;
}
message DeleteRaceGridResponse {
  bool deleted = 1;
}

message CreateResultEntryRequest {
  uint32 race_grid_id = 1;
  uint32 driver_id = 2;
  uint32 car_model_variant_id = 3;
  int32 finishing_position = 4;
  int32 completed_laps = 5;
  int32 fastest_lap_time_ms = 6;
  int32 incidents = 7;
  backend.common.v1.ResultEntryState state = 8;
  string admin_notes = 9;
}

message CreateResultEntryResponse {
  backend.common.v1.ResultEntry result_entry = 1;
}

message UpdateResultEntryRequest {
  uint32 result_entry_id = 1;
  uint32 race_grid_id = 2;
  uint32 driver_id = 3;
  uint32 car_model_variant_id = 4;
  int32 finishing_position = 5;
  int32 completed_laps = 6;
  int32 fastest_lap_time_ms = 7;
  int32 incidents = 8;
  backend.common.v1.ResultEntryState state = 9;
  string admin_notes = 10;
}

message UpdateResultEntryResponse {
  backend.common.v1.ResultEntry result_entry = 1;
}

message DeleteResultEntryRequest {
  uint32 result_entry_id = 1;
}

message DeleteResultEntryResponse {
  bool deleted = 1;
}

message CreateDriverRequest {
  string external_id = 1;
  string name = 2;
  bool is_active = 3;
}

message CreateDriverResponse {
  backend.common.v1.Driver driver = 1;
}

message UpdateDriverRequest {
  uint32 driver_id = 1;
  string external_id = 2;
  string name = 3;
  bool is_active = 4;
}

message UpdateDriverResponse {
  backend.common.v1.Driver driver = 1;
}

message DeleteDriverRequest {
  uint32 driver_id = 1;
}

message DeleteDriverResponse {
  bool deleted = 1;
}

message SetSimulationDriverAliasesRequest {
  uint32 driver_id = 1;
  uint32 simulation_id = 2;
  repeated string simulation_driver_id = 3;
}

message SetSimulationDriverAliasesResponse {
  bool updated = 1;
}

message SetSeasonDriversRequest {
  uint32 season_id = 1;
  repeated SetSeasonDriver drivers = 2;
}

message SetSeasonDriver {
  uint32 driver_id = 1;
  uint32 car_model_variant_id = 2;
  string car_number = 3;
  bool is_guest_driver = 4;
  bool is_rookie_driver = 5;
  google.protobuf.Timestamp joined_at = 6;
  google.protobuf.Timestamp left_at = 7;
}

message SetSeasonDriversResponse {}

message AddSeasonDriverRequest {
  uint32 driver_id = 1;
  uint32 season_id = 2;
  uint32 car_model_variant_id = 3;
  string car_number = 4;
  bool is_guest_driver = 5;
  bool is_rookie_driver = 6;
  google.protobuf.Timestamp joined_at = 7;
  google.protobuf.Timestamp left_at = 8; // optional, if not provided, will be set to null (indicating currently active)
}
message AddSeasonDriverResponse {}
message RemoveSeasonDriverRequest {
  uint32 season_id = 1;
  uint32 driver_id = 2;
  google.protobuf.Timestamp left_at = 3;
}
message RemoveSeasonDriverResponse {}
message DeleteSeasonDriverRequest {
  uint32 id = 1;
}
message DeleteSeasonDriverResponse {}

message SetSeasonCarClassesRequest {
  uint32 season_id = 1;
  repeated uint32 car_class_ids = 2;
  // determines how to update the season car models based on the updated car classes. if not provided, defaults to SEASON_CAR_MODELS_UPDATE_MODE_UNSPECIFIED (do nothing)
  SeasonCarModelsUpdateMode update_mode = 3;
}

message SetSeasonCarClassesResponse {}

message SetSeasonCarModelVariantsRequest {
  uint32 season_id = 1;
  repeated uint32 car_model_variant_ids = 2;
}

message SetSeasonCarModelVariantsResponse {}

message CreateTeamRequest {
  uint32 season_id = 1;
  string name = 2;
  bool is_active = 3;
  uint32 car_model_variant_id = 4;
  string car_number = 5;
  google.protobuf.Timestamp joined_at = 6;
  google.protobuf.Timestamp left_at = 7; // optional, if not provided, will be set to null (indicating currently active)
}

message CreateTeamResponse {
  backend.common.v1.Team team = 1;
}

message UpdateTeamRequest {
  uint32 team_id = 1;
  uint32 season_id = 2;
  string name = 3;
  bool is_active = 4;
  uint32 car_model_variant_id = 5;
  string car_number = 6;
  google.protobuf.Timestamp joined_at = 7;
  google.protobuf.Timestamp left_at = 8; // optional, if not provided, will be set to null (indicating currently active)
}

message UpdateTeamResponse {
  backend.common.v1.Team team = 1;
}

message DeleteTeamRequest {
  uint32 team_id = 1;
}

message DeleteTeamResponse {
  bool deleted = 1;
}

message SetTeamMembersRequest {
  uint32 team_id = 1;
  repeated TeamMember members = 2;
}
message TeamMember {
  uint32 driver_id = 1;
  google.protobuf.Timestamp joined_at = 2;
  google.protobuf.Timestamp left_at = 3; // optional, if not provided, will be set to null (indicating currently active)
}

message SetTeamMembersResponse {}

message AddTeamMemberRequest {
  uint32 team_id = 1;
  uint32 driver_id = 2;
  google.protobuf.Timestamp joined_at = 3; // optional, if not provided, will be set to current time
  google.protobuf.Timestamp left_at = 4; // optional, if not provided, will be set to null (indicating currently active)
}
message AddTeamMemberResponse {}
message RemoveTeamMemberRequest {
  uint32 id = 1; // the ID of the team member entry to update
}
message RemoveTeamMemberResponse {}
message DeleteTeamMemberRequest {
  uint32 id = 1; // the ID of the team member entry to delete
}
message DeleteTeamMemberResponse {}

message CreatePointSystemRequest {
  string name = 1;
  string description = 2;
  backend.common.v1.PointEligibility eligibility = 3;
  repeated backend.common.v1.PointRaceSettings race_settings = 4;
}

message CreatePointSystemResponse {
  backend.common.v1.PointSystem point_system = 1;
}

message UpdatePointSystemRequest {
  uint32 point_system_id = 1;
  string name = 2;
  string description = 3;
  backend.common.v1.PointEligibility eligibility = 4;
  repeated backend.common.v1.PointRaceSettings race_settings = 5;
}

message UpdatePointSystemResponse {
  backend.common.v1.PointSystem point_system = 1;
}

message DeletePointSystemRequest {
  uint32 point_system_id = 1;
}

message DeletePointSystemResponse {
  bool deleted = 1;
}

message CreateTrackRequest {
  string name = 1;
  string country = 2;
  double latitude = 3;
  double longitude = 4;
  string website_url = 5;
}

message CreateTrackResponse {
  backend.common.v1.Track track = 1;
}

message UpdateTrackRequest {
  uint32 track_id = 1;
  string name = 2;
  string country = 3;
  double latitude = 4;
  double longitude = 5;
  string website_url = 6;
}

message UpdateTrackResponse {
  backend.common.v1.Track track = 1;
}

message DeleteTrackRequest {
  uint32 track_id = 1;
}

message DeleteTrackResponse {
  bool deleted = 1;
}

message CreateTrackLayoutRequest {
  uint32 track_id = 1;
  string name = 2;
  int32 length_meters = 3;
  string layout_image_url = 4;
  repeated backend.common.v1.SimulationAliases simulation_aliases = 5;
}

message CreateTrackLayoutResponse {
  backend.common.v1.TrackLayout track_layout = 1;
}

message UpdateTrackLayoutRequest {
  uint32 track_layout_id = 1;
  uint32 track_id = 2;
  string name = 3;
  int32 length_meters = 4;
  string layout_image_url = 5;
  repeated backend.common.v1.SimulationAliases simulation_aliases = 6;
}

message UpdateTrackLayoutResponse {
  backend.common.v1.TrackLayout track_layout = 1;
}

message DeleteTrackLayoutRequest {
  uint32 track_layout_id = 1;
}

message DeleteTrackLayoutResponse {
  bool deleted = 1;
}

message SetSimulationTrackLayoutAliasesRequest {
  uint32 track_layout_id = 1;
  uint32 simulation_id = 2;
  repeated string external_name = 3;
}

message SetSimulationTrackLayoutAliasesResponse {
  bool updated = 1;
}

message CreateCarManufacturerRequest {
  string name = 1;
}

message CreateCarManufacturerResponse {
  backend.common.v1.CarManufacturer car_manufacturer = 1;
}

message UpdateCarManufacturerRequest {
  uint32 car_manufacturer_id = 1;
  string name = 2;
}

message UpdateCarManufacturerResponse {
  backend.common.v1.CarManufacturer car_manufacturer = 1;
}

message DeleteCarManufacturerRequest {
  uint32 car_manufacturer_id = 1;
}

message DeleteCarManufacturerResponse {
  bool deleted = 1;
}

message CreateCarModelRequest {
  uint32 manufacturer_id = 1;
  string name = 2;
}

message CreateCarModelResponse {
  backend.common.v1.CarModel car_model = 1;
}

message UpdateCarModelRequest {
  uint32 car_model_id = 1;
  uint32 manufacturer_id = 2;
  string name = 3;
}

message UpdateCarModelResponse {
  backend.common.v1.CarModel car_model = 1;
}

message DeleteCarModelRequest {
  uint32 car_model_id = 1;
}

message DeleteCarModelResponse {
  bool deleted = 1;
}

message CreateCarModelVariantRequest {
  uint32 model_id = 1;
  string name = 2;
  repeated backend.common.v1.SimulationAliases simulation_aliases = 3;
}

message CreateCarModelVariantResponse {
  backend.common.v1.CarModelVariant car_model_variant = 1;
}

message UpdateCarModelVariantRequest {
  uint32 car_model_variant_id = 1;
  uint32 model_id = 2;
  string name = 3;
  repeated backend.common.v1.SimulationAliases simulation_aliases = 4;
}

message UpdateCarModelVariantResponse {
  backend.common.v1.CarModelVariant car_model_variant = 1;
}

message DeleteCarModelVariantRequest {
  uint32 car_model_variant_id = 1;
}

message DeleteCarModelVariantResponse {
  bool deleted = 1;
}

message CreateCarClassRequest {
  string name = 1;
}

message CreateCarClassResponse {
  backend.common.v1.CarClass car_class = 1;
}

message UpdateCarClassRequest {
  uint32 car_class_id = 1;
  string name = 2;
}

message UpdateCarClassResponse {
  backend.common.v1.CarClass car_class = 1;
}

message DeleteCarClassRequest {
  uint32 car_class_id = 1;
}

message DeleteCarClassResponse {
  bool deleted = 1;
}
message AssignCarModelVariantToCarClassRequest {
  uint32 car_model_variant_id = 1;
  uint32 car_class_id = 2;
}

message AssignCarModelVariantToCarClassResponse {}

message AssignCarClassToSeasonRequest {
  uint32 car_class_id = 1;
  uint32 season_id = 2;
}

message AssignCarClassToSeasonResponse {}

message UnassignCarModelVariantFromCarClassRequest {
  uint32 car_model_variant_id = 1;
  uint32 car_class_id = 2;
}

message UnassignCarModelVariantFromCarClassResponse {}

message UnassignCarClassFromSeasonRequest {
  uint32 car_class_id = 1;
  uint32 season_id = 2;
}

message UnassignCarClassFromSeasonResponse {}

message SetSimulationCarAliasesRequest {
  uint32 car_model_variant_id = 1;
  uint32 simulation_id = 2;
  repeated string external_name = 3;
}

message SetSimulationCarAliasesResponse {
  bool updated = 1;
}

enum SeasonCarModelsUpdateMode {
  SEASON_CAR_MODELS_UPDATE_MODE_UNSPECIFIED = 0; // do nothing
  SEASON_CAR_MODELS_UPDATE_MODE_REPLACE = 1; // replace existing season car models (computed by car classes)
  SEASON_CAR_MODELS_UPDATE_MODE_INSERT_WHEN_EMPTY = 2; // add season car models if no exist
}
