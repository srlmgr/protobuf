syntax = "proto3";

package backend.common.v1;

import "google/protobuf/timestamp.proto";

// Entity Models
message Simulation {
  uint32 id = 1;
  string name = 2;
  bool is_active = 3;
  repeated ImportConfig supported_formats = 4;
}

message ImportConfig {
  backend.common.v1.ImportFormat format = 1;
  bool allow_multiple_uploads = 2;
}

message Series {
  uint32 id = 1;
  uint32 simulation_id = 2;
  string name = 3;
  string description = 4;
  bool is_active = 5;
}

message Season {
  uint32 id = 1;
  uint32 series_id = 2;
  string name = 3;
  uint32 point_system_id = 4;
  int32 skip_events = 5;
  bool has_teams = 6; // uses team standings (in addition to driver standings)
  bool is_team_based = 7; // use teams instead of drivers for points and standings
  int32 team_points_top_n = 8; // use top N team driver results for team standings
  bool is_multiclass = 9;
  string status = 10;
  google.protobuf.Timestamp starts_at = 11;
  google.protobuf.Timestamp ends_at = 12;
}

message Event {
  uint32 id = 1;
  uint32 season_id = 2;
  uint32 track_layout_id = 3;
  string name = 4;
  uint32 sequence_no = 5;
  google.protobuf.Timestamp event_date = 6;
  EventStatus status = 7;
  EventProcessingState processing_state = 8;
}

message Race {
  uint32 id = 1;
  uint32 event_id = 2;
  string name = 3;
  RaceSessionType session_type = 4;
  int32 sequence_no = 5;
}
message RaceGrid {
  uint32 id = 1;
  uint32 race_id = 2;
  string name = 3;
  RaceSessionType session_type = 4;
  int32 sequence_no = 5;
}

message Driver {
  uint32 id = 1;
  string external_id = 2;
  string name = 3;
  bool is_active = 4;
}

message SeasonDriver {
  uint32 id = 1;
  uint32 driver_id = 2;
  uint32 season_id = 3;
  uint32 car_model_variant_id = 4;
  string car_number = 5;
  bool is_guest_driver = 6;
  bool is_rookie_driver = 7;
  google.protobuf.Timestamp joined_at = 8;
  google.protobuf.Timestamp left_at = 9;
}

// Represents an alias for a driver in a specific simulation, used for mapping imported results to existing drivers
message DriverAlias {
  uint32 simulation_id = 1;
  repeated string simulation_driver_id = 2;
}

message Team {
  uint32 id = 1;
  uint32 season_id = 2;
  string name = 3;
  bool is_active = 4;
  uint32 car_model_variant_id = 5;
  string car_number = 6;
  google.protobuf.Timestamp joined_at = 7;
  google.protobuf.Timestamp left_at = 8;
}

message TeamMember {
  uint32 id = 1;
  uint32 team_id = 2;
  Driver driver = 3;
  google.protobuf.Timestamp joined_at = 4;
  google.protobuf.Timestamp left_at = 5;
}

message PointRule {
  string kind = 1;
  int32 position = 2;
  int32 points = 3;
  string metadata_json = 4;
}
message PointEligibility {
  double min_race_distance_percent = 1;
  bool guests = 2;
}

message PointTable {
  repeated int32 values = 1;
}

message PositionPointsConfig {
  repeated PointTable tables = 1;
}

message ThresholdPenaltyRule {
  uint32 threshold = 1;
  double penalty_percent = 2;
}

message ThresholdPenaltyConfig {
  repeated ThresholdPenaltyRule rules = 1;
}

message PointPolicySettings {
  PointPolicy name = 1;
  oneof config {
    PositionPointsConfig finish_pos = 2;
    PositionPointsConfig qualification_pos = 3;
    PositionPointsConfig least_incidents = 4;
    PositionPointsConfig fastest_lap = 5;
    PositionPointsConfig top_n_finisher = 6;
    ThresholdPenaltyConfig incidents_exceeded = 7;
  }
}

message PointRaceSettings {
  string name = 1;
  repeated PointPolicySettings policies = 2;
}
message PointSystem {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  PointEligibility eligibility = 4;
  repeated PointRaceSettings race_settings = 5;
}

message Track {
  uint32 id = 1;
  string name = 2;
  string country = 3;
  double latitude = 4;
  double longitude = 5;
  string website_url = 6;
}

message TrackLayout {
  uint32 id = 1;
  uint32 track_id = 2;
  string name = 3;
  int32 length_meters = 4;
  string layout_image_url = 5;
}

// Represents aliases used in simulations to be associated with an entity.
// for example: a single track layout may be referred to by different identifiers different simulations
message SimulationAliases {
  uint32 simulation_id = 1;
  repeated string identifiers = 2;
}

message CarManufacturer {
  uint32 id = 1;
  string name = 2;
}

// New hierarchy: manufacturer -> model -> model_variant.
// Kept separate from legacy CarBrand/CarModel for additive v1 rollout.
message CarModel {
  uint32 id = 1;
  uint32 manufacturer_id = 2;
  string name = 3;
}

message CarModelVariant {
  uint32 id = 1;
  uint32 model_id = 2;
  string name = 3;
}

message CarClass {
  uint32 id = 1;
  string name = 2;
}

message ResultEntry {
  uint32 id = 1;
  uint32 race_grid_id = 2;
  uint32 driver_id = 3;
  uint32 team_id = 4;
  uint32 car_model_variant_id = 5;
  uint32 car_class_id = 6;
  string car_number = 7;
  int32 starting_position = 8;
  int32 finishing_position = 9;
  int32 completed_laps = 10;
  int32 quali_time_ms = 11;
  int32 fastest_lap_time_ms = 12;
  int32 incidents = 13;
  int32 total_time_ms = 14;
  ResultEntryState state = 15;
  string admin_notes = 16;
  string raw_driver_name = 17;
  string raw_team_name = 18;
  string raw_car_name = 19;
  bool is_guest_driver = 20;
}

message BookingEntry {
  uint32 id = 1;
  uint32 event_id = 2;
  uint32 race_id = 3;
  uint32 race_grid_id = 4;
  uint32 car_class_id = 5;
  BookingTargetType target_type = 6;
  uint32 target_id = 7;
  BookingSourceType source_type = 8;
  int32 points = 9;
  string description = 10;
}

message StandingsContribution {
  uint32 sequence_no = 1;
  int32 points = 2;
  int32 bonus_points = 3;
  int32 total_points = 4;
  bool is_dropped = 5;
}
message SummarySelector {
  oneof scope {
    uint32 event_id = 1;
    uint32 race_id = 2;
  }
  SummaryTargetType type = 3;
}

message Summary {
  uint32 reference_id = 1;
  uint32 car_class_id = 2;
  int32 points = 3;
  int32 bonus_points = 4;
  int32 penalty_points = 5;
  int32 total_points = 6;
}

message StandingData {
  int32 position = 1;
  int32 prev_position = 2;
  int32 total_points = 3;
  int32 bonus_points = 4;
  int32 penalty_points = 5;
  int32 num_events = 6;
  int32 num_races = 7;
  int32 num_penalty_free = 8;
  int32 num_wins = 9;
  int32 num_podiums = 10;
  int32 num_top5 = 11;
  int32 num_top10 = 12;
}

//deprecated, see query/standings.proto for substitute
message DriverStanding {
  uint32 driver_id = 1;
  uint32 event_id = 2;
  uint32 car_class_id = 3;
  StandingData data = 4;
  repeated uint32 dropped_event_ids = 5;
}

//deprecated, see query/standings.proto for substitute
message TeamStanding {
  uint32 team_id = 1;
  uint32 event_id = 2;
  uint32 car_class_id = 3;
  StandingData data = 4;
  repeated uint32 dropped_event_ids = 5;
}

message UnresolvedMapping {
  string source_value = 1;
  string mapping_type = 2;
}

// Enums
enum ResultEntryState {
  RESULT_ENTRY_STATE_UNSPECIFIED = 0;
  RESULT_ENTRY_STATE_MAPPING_ERROR = 1;
  RESULT_ENTRY_STATE_NORMAL = 2;
  RESULT_ENTRY_STATE_DQ = 3;
}

enum BookingTargetType {
  BOOKING_TARGET_TYPE_UNSPECIFIED = 0;
  BOOKING_TARGET_TYPE_DRIVER = 1;
  BOOKING_TARGET_TYPE_TEAM = 2;
}

enum BookingSourceType {
  BOOKING_SOURCE_TYPE_UNSPECIFIED = 0;
  BOOKING_SOURCE_TYPE_FINISH_POS = 1;
  BOOKING_SOURCE_TYPE_QUALIFICATION_POS = 2;
  BOOKING_SOURCE_TYPE_LEAST_INCIDENTS = 3;
  BOOKING_SOURCE_TYPE_FASTEST_LAP = 4;
  BOOKING_SOURCE_TYPE_TOP_N_FINISHERS = 5;
  BOOKING_SOURCE_TYPE_INCIDENTS_EXCEEDED = 6;
  BOOKING_SOURCE_TYPE_PENALTY_POINTS = 7;
  BOOKING_SOURCE_TYPE_TEAM_CONTRIBUTION = 8;
  BOOKING_SOURCE_TYPE_MANUAL_ADJUSTMENT = 9;
}
enum SummaryTargetType {
  SUMMARY_TARGET_TYPE_UNSPECIFIED = 0;
  SUMMARY_TARGET_TYPE_DRIVER = 1;
  SUMMARY_TARGET_TYPE_TEAM = 2;
}

enum ImportFormat {
  IMPORT_FORMAT_UNSPECIFIED = 0;
  IMPORT_FORMAT_JSON = 1;
  IMPORT_FORMAT_CSV = 2;
  IMPORT_FORMAT_XML = 3;
}

enum RaceSessionType {
  RACE_SESSION_TYPE_UNSPECIFIED = 0;
  RACE_SESSION_TYPE_QUALIFYING = 1;
  RACE_SESSION_TYPE_HEAT = 2;
  RACE_SESSION_TYPE_RACE = 3;
}
enum EventStatus {
  EVENT_STATUS_UNSPECIFIED = 0;
  EVENT_STATUS_SCHEDULED = 1;
  EVENT_STATUS_COMPLETED = 2;
}
enum EventProcessingState {
  EVENT_PROCESSING_STATE_UNSPECIFIED = 0;
  EVENT_PROCESSING_STATE_DRAFT = 1;
  EVENT_PROCESSING_STATE_RAW_IMPORTED = 2;
  EVENT_PROCESSING_STATE_MAPPING_ERRORS = 3;
  EVENT_PROCESSING_STATE_PRE_PROCESSED = 4;
  EVENT_PROCESSING_STATE_DRIVER_ENTRIES_PROCESSED = 5;
  EVENT_PROCESSING_STATE_TEAM_ENTRIES_PROCESSED = 6;
  EVENT_PROCESSING_STATE_COMPUTED = 7;
  EVENT_PROCESSING_STATE_FINALIZED = 8;
}
enum PointPolicy {
  POINT_POLICY_UNSPECIFIED = 0;
  POINT_POLICY_FINISH_POS = 1;
  POINT_POLICY_QUALIFICATION_POS = 2;
  POINT_POLICY_LEAST_INCIDENTS = 3;
  POINT_POLICY_FASTEST_LAP = 4;
  POINT_POLICY_TOP_N_FINISHER = 5;
  POINT_POLICY_INCIDENTS_EXCEEDED = 6;
}
